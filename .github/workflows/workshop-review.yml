name: Workshop Review

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [sync, approve, reject, revoke]
        default: sync
        required: true
      submission_id:
        description: '投稿编号（approve/reject/revoke 必填）'
        type: string
      message:
        description: '维护者审核或撤回说明'
        type: string
      game_version:
        description: '实际测试的游戏版本（approve 必填）'
        type: string
      game_evidence:
        description: '游戏实测证据链接或编号（approve 必填）'
        type: string
      game_notes:
        description: '游戏实测过程与结论，至少 20 字（approve 必填）'
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: workshop-review
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'kldsjfas/JiXingModHelper' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed workshop bridge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 7b3a973ceb02839ca0ad50a4f29884eb2038934b # reviewed source; never accepts an input ref
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install checked dependencies
        run: python -m pip install -r requirements.txt
      - name: Review quarantined resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKSHOP_ADMIN_SECRET: ${{ secrets.WORKSHOP_ADMIN_SECRET }}
          WORKSHOP_REVIEW_TUNNEL_PORT: '18443'
          WORKSHOP_REVIEW_SSH_HOST: ${{ secrets.WORKSHOP_REVIEW_SSH_HOST }}
          WORKSHOP_REVIEW_SSH_PORT: ${{ secrets.WORKSHOP_REVIEW_SSH_PORT }}
          WORKSHOP_REVIEW_SSH_KEY: ${{ secrets.WORKSHOP_REVIEW_SSH_KEY }}
          WORKSHOP_REVIEW_KNOWN_HOSTS: ${{ secrets.WORKSHOP_REVIEW_KNOWN_HOSTS }}
          BRIDGE_ACTION: ${{ github.event.inputs.action || 'sync' }}
          SUBMISSION_ID: ${{ github.event.inputs.submission_id }}
          REVIEW_MESSAGE: ${{ github.event.inputs.message }}
          GAME_VERSION: ${{ github.event.inputs.game_version }}
          GAME_EVIDENCE: ${{ github.event.inputs.game_evidence }}
          GAME_NOTES: ${{ github.event.inputs.game_notes }}
          PYTHONPATH: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          review_dir=$(mktemp -d "$RUNNER_TEMP/jixing-review.XXXXXXXX")
          chmod 700 "$review_dir"
          tunnel_pid=''
          trap 'if [ -n "$tunnel_pid" ]; then kill "$tunnel_pid" 2>/dev/null || true; wait "$tunnel_pid" 2>/dev/null || true; fi; rm -f "$review_dir/key" "$review_dir/known_hosts"; rmdir "$review_dir"' EXIT
          umask 077
          printf '%s\n' "$WORKSHOP_REVIEW_SSH_KEY" > "$review_dir/key"
          printf '%s\n' "$WORKSHOP_REVIEW_KNOWN_HOSTS" > "$review_dir/known_hosts"
          python -B - <<'PY'
          import ipaddress, os
          address = ipaddress.ip_address(os.environ['WORKSHOP_REVIEW_SSH_HOST'])
          port = os.environ['WORKSHOP_REVIEW_SSH_PORT']
          if not address.is_global or not port.isascii() or not port.isdigit() or not 1 <= int(port) <= 65535:
              raise SystemExit('The protected review SSH route is invalid')
          PY
          ssh -N -L 127.0.0.1:18443:127.0.0.1:19443 \
            -i "$review_dir/key" -p "$WORKSHOP_REVIEW_SSH_PORT" -l jixing-review-tunnel \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$review_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ExitOnForwardFailure=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -- "$WORKSHOP_REVIEW_SSH_HOST" &
          tunnel_pid=$!
          python -B - <<'PY'
          import os, socket, time
          for attempt in range(60):
              try:
                  with socket.create_connection(('127.0.0.1',18443),timeout=1):
                      break
              except OSError:
                  time.sleep(0.25)
          else:
              raise SystemExit('The restricted review tunnel did not start')
          PY
          python -B tools/workshop_github_bridge.py
