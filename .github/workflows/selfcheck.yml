name: Safe Selfcheck

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfcheck:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run safe selfcheck
        run: python selfcheck.py

      - name: Check text editing and draft safety
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check animation import and playback
        shell: pwsh
        run: |
          python selfcheck_animation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python selfcheck_clip.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python selfcheck_clip_preview.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check frontend syntax
        run: node --check astral_party_auto/webui/app.js
