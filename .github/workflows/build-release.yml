name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfcheck:
    uses: ./.github/workflows/selfcheck.yml

  build:
    needs: selfcheck
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.x'

      - name: Read checked build version
        id: version
        shell: pwsh
        run: |
          $version = python -B tools/publish_release.py --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release
        shell: pwsh
        run: ./build_exe.ps1

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/JiXingModHelper -DestinationPath JiXingModHelper.zip
          $checksum = (Get-FileHash JiXingModHelper.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  JiXingModHelper.zip" | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: JiXingModHelper-${{ github.sha }}
          path: |
            JiXingModHelper.zip
            SHA256SUMS.txt
            RELEASE_NOTES.md
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Checkout the checked source commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: JiXingModHelper-${{ github.sha }}
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: python -B tools/publish_release.py
